# Visit https://github.com/lowlighter/metrics/blob/master/action.yml for full reference
name: Metrics
on:
  # Schedule updates (every other hour)
  schedule: [{ cron: "0 8 * * *" }]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: { branches: ["master", "main"] }
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: gh-metrics/metrics@master
        with:
          # Your GitHub token
          # The following scopes are required:
          #  - public_access (default scope)
          # The following additional scopes may be required:
          #  - read:org      (for organization related metrics)
          #  - read:user     (for user related data)
          #  - read:packages (for some packages related data)
          #  - repo          (optional, if you want to include private repositories)
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          debug: yes
          plugins_errors_fatal: true
          use_prebuilt_image: yes
          notice_releases: no
          retries: 3
          retries_delay: 300
          optimize: css, xml, svg
          experimental_features: --optimize-svg
          user: yobson1
          template: classic
          base: header, activity, repositories, metadata
          base_indepth: yes
          repositories: 500
          repositories_batch: 50
          users_ignored: github-actions[bot], dependabot[bot], dependabot-preview[bot], actions-user, action@github.com, renovate[bot]
          config_display: large
          config_octicon: yes
          config_timezone: Europe/London

          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          repositories_forks: yes

          extras_css: |
            h1, h2, h3 {
              color: #ff76cd;
            }
          extras_js: |
            let days = document.getElementsByClassName("day"); for (let day of days) {if (day.getAttributeNS(null, "fill") == "#ebedf0") {day.setAttributeNS(null, "fill", "#161b22")}}

          config_order: base.header, base.activity+community, base.repositories, achievements, languages
